<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mide tu huella · RGNERA</title>
<style>
  :root{--olive:#475323; --olive2:#39481c; --cream:#F5F1E6; --amber:#C58A2E;
        --sage:#AEB98C}
  *{box-sizing:border-box; margin:0}
  html,body{height:100%; overflow:hidden}          /* nunca scrollbar */
  body{
    font-family:"Segoe UI",-apple-system,Roboto,"Helvetica Neue",sans-serif;
    background:radial-gradient(130% 130% at 82% 8%, #52602c 0%, var(--olive) 48%, var(--olive2) 100%);
    color:var(--cream); display:flex; align-items:center; justify-content:center;
    padding:1rem 1.15rem;
  }
  .wrap{
    width:100%; max-width:860px; display:flex; flex-direction:column;
    align-items:center; text-align:center; gap:.55rem;
  }
  .logo{width:40px; height:40px; flex-shrink:0}
  .eyebrow{text-transform:uppercase; letter-spacing:.18em; font-size:.66rem;
           font-weight:700; color:var(--sage)}
  h1{font-family:Georgia,"Times New Roman",serif; font-weight:600;
     font-size:clamp(1.25rem,4.4vw,1.85rem); line-height:1.12; text-wrap:balance}
  h1 em{color:#e9cb8d; font-style:normal}
  p{font-size:clamp(.82rem,2.3vw,.98rem); color:#e7e6d8; line-height:1.35;
    max-width:34rem}
  .btn{
    display:inline-flex; align-items:center; gap:.45rem; white-space:nowrap;
    background:var(--amber); color:#231a0a; text-decoration:none; font-weight:700;
    font-size:clamp(.95rem,2.4vw,1.05rem); padding:.72rem 1.5rem; border-radius:999px;
    box-shadow:0 5px 16px rgba(0,0,0,.26); transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.32)}
  .btn:focus-visible{outline:3px solid var(--cream); outline-offset:3px}
  .meta{font-size:.7rem; color:var(--sage); letter-spacing:.02em}

  /* Pantallas anchas: fila compacta (logo | texto | botón) = muy bajito */
  @media (min-width:620px){
    .wrap{flex-direction:row; text-align:left; gap:1.3rem; justify-content:center}
    .logo{width:56px; height:56px}
    .txt{flex:0 1 auto}
    .btn-col{display:flex; flex-direction:column; align-items:center; gap:.3rem; flex-shrink:0}
    h1{font-size:clamp(1.4rem,2.6vw,1.9rem)}
  }
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="__LOGO__" alt="RGNERA">
    <div class="txt">
      <div class="eyebrow">RGNERA · Herramienta gratuita</div>
      <h1>Mide tu <em>huella ambiental</em></h1>
      <p>Tu CO₂ mensual con datos oficiales de México, en 2 minutos.</p>
    </div>
    <div class="btn-col">
      <a class="btn" href="https://www.rgnera.com/calculadora" target="_top"
         rel="noopener">Calcular mi huella →</a>
      <span class="meta">Gratis · sin registro</span>
    </div>
  </div>
</body>
</html>
